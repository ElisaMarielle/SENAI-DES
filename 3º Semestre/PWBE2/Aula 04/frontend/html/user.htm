<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitParty — Cadastrar usuário</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="left">
            <h1>GitParty</h1>
            <a href="index.htm">Descubra</a>
            <a href="cad.htm">Organize</a>
        </div>
        <div class="right">
            <a href="#">Entrar</a>
            <a href="user.htm">Cadastre-se</a>
            <a href="cad.htm">Crie um evento</a>
        </div>
    </header>

    <main>
        <div class="top">
            <h2 style="margin-bottom: 8px;"><span>Cadastre-se</span></h2>
            <p>Coloque os detalhes abaixo para cadastrar o usuário.</p>
        </div>
        <div class="form">
            <form action="" id="form" class="formu">
                <div class="nome">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Ex.: Tereza de Alvares" required>
                </div>
                <div class="email">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Ex.: tereza@gmail.com" required>
                </div>
                <div class="senha">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha" required>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </div>
    </main>
    <script src="../scripts/cadastro.js"></script>
</body>
</html>
